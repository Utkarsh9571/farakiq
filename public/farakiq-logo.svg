<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" fill="none">
  <style>
    .farak-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 58px;
      letter-spacing: -2px;
      fill: #FFFFFF;
    }
    .iq-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 58px;
      letter-spacing: -2px;
      fill: #FF4A34;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 6px;
      fill: #8A8A8E;
    }
  </style>
  <g transform="skewX(-8) translate(14, 0)">
    <text x="10" y="52">
      <tspan class="farak-text">FARAK</tspan><tspan class="iq-text">IQ</tspan>
    </text>
  </g>
  <text x="20" y="80" class="tagline-text">WE MAKE THE DIFFERENCE</text>
</svg>
