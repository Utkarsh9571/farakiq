<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0D0F12"/>
  
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow -->
  <circle cx="950" cy="150" r="300" fill="rgba(255, 74, 52, 0.08)" filter="blur(60px)"/>

  <!-- Technical Badge -->
  <rect x="96" y="140" width="440" height="36" rx="2" fill="#16191E" stroke="#272B30" stroke-width="1"/>
  <circle cx="116" cy="158" r="4" fill="#FF4A34"/>
  <text x="132" y="162" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" fill="#A6A9A0" letter-spacing="0.08em">WEB DEVELOPMENT • FULL-STACK • AI &amp; AUTOMATION</text>

  <!-- Farakiq Brand Title -->
  <text x="96" y="270" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="96" fill="#FFFFFF" letter-spacing="0.08em">FARAKIQ</text>

  <!-- Tagline -->
  <text x="98" y="320" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="22" fill="#FF4A34" letter-spacing="0.25em">WE MAKE THE DIFFERENCE</text>

  <!-- Description -->
  <text x="98" y="410" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="30" fill="#A6A9A0">Custom Web Applications • Business Websites • E-Commerce Platforms</text>
  <text x="98" y="455" font-family="'Space Grotesk', sans-serif" font-weight="400" font-size="24" fill="#5B5F55">Engineering high-performance web systems and automated workflow solutions.</text>

  <!-- Footer Info -->
  <line x1="96" y1="520" x2="1104" y2="520" stroke="#272B30" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="96" y="565" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#EDEAE0">farakiq.com</text>
  <text x="1104" y="565" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#A6A9A0" text-anchor="end">Led by Darwin Swami • Utkarsh Sharma</text>
</svg>
