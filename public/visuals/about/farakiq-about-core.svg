<svg width="800" height="900" viewBox="0 0 800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Studio Background Gradient -->
    <radialGradient id="studioBackdrop" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stopColor="#151821" />
      <stop offset="45%" stopColor="#0D0F14" />
      <stop offset="100%" stopColor="#07080B" />
    </radialGradient>

    <!-- Floor Ambient Occlusion Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.8" />
      <stop offset="60%" stopColor="#000000" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Brushed Matte Graphite Material (Base & Foundation) -->
    <linearGradient id="matteGraphiteTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#2A303C" />
      <stop offset="40%" stopColor="#1E232C" />
      <stop offset="100%" stopColor="#14171E" />
    </linearGradient>

    <linearGradient id="matteGraphiteLeft" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#1E222A" />
      <stop offset="100%" stopColor="#0D0F13" />
    </linearGradient>

    <linearGradient id="matteGraphiteRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14171D" />
      <stop offset="100%" stopColor="#08090C" />
    </linearGradient>

    <!-- Brushed Titanium Vertical Monolith (Growth / Momentum) -->
    <linearGradient id="titaniumMonolithFront" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#485366" />
      <stop offset="30%" stopColor="#2C3340" />
      <stop offset="70%" stopColor="#181C23" />
      <stop offset="100%" stopColor="#0E1015" />
    </linearGradient>

    <linearGradient id="titaniumMonolithFlank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1C2028" />
      <stop offset="100%" stopColor="#090A0D" />
    </linearGradient>

    <linearGradient id="titaniumTopFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#697792" />
      <stop offset="50%" stopColor="#4F5B70" />
      <stop offset="100%" stopColor="#333B49" />
    </linearGradient>

    <!-- Smoked Obsidian Glass (Intelligence / AI Core) -->
    <linearGradient id="smokedObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1C222D" stopOpacity="0.95" />
      <stop offset="50%" stopColor="#10141C" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#080A0E" stopOpacity="0.98" />
    </linearGradient>

    <!-- Subtle Internal Coral Light Emission (Precision Refraction) -->
    <linearGradient id="coralCoreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF6B4E" />
      <stop offset="100%" stopColor="#FF3E26" />
    </linearGradient>

    <radialGradient id="internalWarmth" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stopColor="#FF5C38" stopOpacity="0.4" />
      <stop offset="40%" stopColor="#FF3E26" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Precision Edge Specular Glint -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.9" />
      <stop offset="60%" stopColor="#E2E8F0" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
    </linearGradient>

    <!-- Restrained Cyan Edge Refraction -->
    <linearGradient id="cyanEdgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#00F0FF" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#00B8D9" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#008099" stopOpacity="0" />
    </linearGradient>

    <!-- Soft Studio Diffuse Filter -->
    <filter id="softContactBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <!-- Studio Background Canvas -->
  <rect width="800" height="900" fill="url(#studioBackdrop)" />

  <!-- Studio Floor Contact Shadow -->
  <ellipse cx="400" cy="740" rx="280" ry="64" fill="url(#floorShadow)" />
  <ellipse cx="400" cy="735" rx="190" ry="32" fill="#000000" fill-opacity="0.85" />

  <!-- ============================================================ -->
  <!-- THE FARAKIQ SCULPTURE: 3 INTERCONNECTED FORMS IN 1 SYSTEM -->
  <!-- ============================================================ -->
  <g id="sculpture-assembly" transform="translate(0, 20)">

    <!-- ============================================================ -->
    <!-- FORM 1: ARCHITECTURAL FOUNDATION (Engineering & Structure) -->
    <!-- ============================================================ -->
    <g id="foundation-base">
      <!-- Base Slab Top Face -->
      <polygon
        points="400,520 620,610 400,700 180,610"
        fill="url(#matteGraphiteTop)"
        stroke="#333B49"
        stroke-width="1.5"
      />

      <!-- Base Slab Left Flank -->
      <polygon
        points="180,610 400,700 400,735 180,645"
        fill="url(#matteGraphiteLeft)"
        stroke="#181D24"
        stroke-width="1.5"
      />

      <!-- Base Slab Right Flank (Shadow Side) -->
      <polygon
        points="400,700 620,610 620,645 400,735"
        fill="url(#matteGraphiteRight)"
        stroke="#12151B"
        stroke-width="1.5"
      />

      <!-- Precision Chamfer Highlight on Leading Edge -->
      <path
        d="M 180 610 L 400 700 L 620 610"
        stroke="url(#specularGlint)"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-opacity="0.75"
      />

      <!-- Recessed Interlocking Groove on Foundation -->
      <polygon
        points="400,555 540,612 400,670 260,612"
        fill="#0A0C10"
        stroke="#1E242E"
        stroke-width="1.25"
      />
    </g>

    <!-- ============================================================ -->
    <!-- FORM 2: ASCENDING VERTICAL MONOLITH (Growth & Momentum) -->
    <!-- ============================================================ -->
    <g id="growth-monolith">
      <!-- Cast Shadow on Base -->
      <polygon
        points="400,555 510,600 450,650 350,610"
        fill="#040507"
        fill-opacity="0.7"
      />

      <!-- Left Main Body (Key-lit Brushed Titanium) -->
      <polygon
        points="340,160 460,210 460,590 340,540"
        fill="url(#titaniumMonolithFront)"
        stroke="#3A4454"
        stroke-width="1.25"
      />

      <!-- Right Flank (Deep Architectural Shade with Cyan Rim) -->
      <polygon
        points="460,210 520,185 520,565 460,590"
        fill="url(#titaniumMonolithFlank)"
        stroke="#202632"
        stroke-width="1.25"
      />

      <!-- Top Sculptural Facet -->
      <polygon
        points="340,160 400,135 520,185 460,210"
        fill="url(#titaniumTopFacet)"
        stroke="#627088"
        stroke-width="1.5"
      />

      <!-- Top Edge Specular Catchlight -->
      <line
        x1="340"
        y1="160"
        x2="460"
        y2="210"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"
        stroke-opacity="0.85"
      />
      <line
        x1="460"
        y1="210"
        x2="520"
        y2="185"
        stroke="url(#cyanEdgeGrad)"
        stroke-width="1.5"
        stroke-linecap="round"
      />

      <!-- Precision Vertical Spine Highlight -->
      <line
        x1="460"
        y1="210"
        x2="460"
        y2="590"
        stroke="url(#specularGlint)"
        stroke-width="1.25"
        stroke-opacity="0.6"
      />
    </g>

    <!-- ============================================================ -->
    <!-- FORM 3: CENTRAL INTELLIGENT CORE (Intelligence & AI) -->
    <!-- Smoked Obsidian Glass Polyhedron Nestled at Intersect -->
    <!-- ============================================================ -->
    <g id="intelligent-core">
      <!-- Internal Ambient Warmth Refraction Layer -->
      <circle cx="375" cy="465" r="95" fill="url(#internalWarmth)" />

      <!-- Back Shadowing for Depth -->
      <polygon
        points="270,440 375,385 450,445 375,540"
        fill="#06080B"
        fill-opacity="0.85"
      />

      <!-- Obsidian Facet A (Top-Left Angle) -->
      <polygon
        points="375,385 450,445 375,475 300,415"
        fill="url(#smokedObsidian)"
        stroke="#364050"
        stroke-width="1.25"
      />

      <!-- Obsidian Facet B (Front-Facing Studio Plane) -->
      <polygon
        points="300,415 375,475 375,555 300,495"
        fill="#12161E"
        stroke="#2D3644"
        stroke-width="1.25"
      />

      <!-- Obsidian Facet C (Key-Lit Coral Refraction Plane) -->
      <polygon
        points="375,475 450,445 450,525 375,555"
        fill="#0B0E14"
        stroke="#242B36"
        stroke-width="1.25"
      />

      <!-- Glowing Coral Internal Core Conduit Line -->
      <path
        d="M 375 385 L 375 475 L 450 525"
        stroke="url(#coralCoreGlow)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Precision Luminous Origin Node Point -->
      <circle cx="375" cy="475" r="4.5" fill="#FF4A34" />
      <circle cx="375" cy="475" r="2" fill="#FFFFFF" />

      <!-- Subtle Cyan Translucent Light Reflection -->
      <path
        d="M 300 415 L 375 385"
        stroke="#00F0FF"
        stroke-width="1.5"
        stroke-opacity="0.6"
        stroke-linecap="round"
      />

      <!-- Floating Interconnected Precision Ring Accent (Very subtle) -->
      <ellipse
        cx="375"
        cy="470"
        rx="115"
        ry="42"
        fill="none"
        stroke="#2B3342"
        stroke-width="1"
        stroke-dasharray="6 12"
        stroke-opacity="0.6"
        transform="rotate(-18 375 470)"
      />
    </g>

  </g>
</svg>
